name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check that the tag matches the version, changelog and plan
        run: uv run scripts/release.py check "${TAG#v}"
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv build
      - run: uv run scripts/release.py notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub release
        run: >
          gh release create "$TAG" dist/*
          --verify-tag
          --title "cinode-client ${TAG#v}"
          --notes-file "$RUNNER_TEMP/notes.md"
